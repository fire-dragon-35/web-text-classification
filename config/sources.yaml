  # webbplatser, sorterade efter prioritet
  - id: informationsverige  # länsstyrelserna: samhällsinformation, bara svenska (/sv/)
    urls:
      - "https://www.informationsverige.se/sv/hem.html"
    max_pages: 150
  - id: fk  # försäkringskassan, privatperson
    urls:
      - "https://www.forsakringskassan.se/privatperson"
    max_pages: 100
  - id: skatteverket  # privatperson: skatt, folkbokföring, dödsfall
    urls:
      - "https://www.skatteverket.se/privat"
    max_pages: 60
  - id: domstol  # sveriges domstolar, ämnen (familj, brott, hyra, skulder)
    urls:
      - "https://www.domstol.se/amnen/"
    max_pages: 80
  - id: af  # arbetsförmedlingen, arbetssökande
    urls:
      - "https://arbetsformedlingen.se/for-arbetssokande"
    max_pages: 60
  - id: migrationsverket  # migrationsverket, privatperson (svenska)
    urls:
      - "https://www.migrationsverket.se/du-vill-ansoka.html"
    allow: ["/du-vill-ansoka", "/du-vill-forlanga", "/du-vantar-pa-beslut", "/du-har-fatt-beslut", "/du-har-tillstand-i-sverige", "/lamna-sverige", "/om-det-svenska-samhallet"]
    max_pages: 50
  - id: konsumentverket  # konsumentverket inkl. tidigare hallå konsument
    urls:
      - "https://www.konsumentverket.se/konsument/"
    allow: ["/konsument/", "/omrade/"]
    max_pages: 50
  - id: kronofogden  # kronofogden, privatperson
    urls:
      - "https://www.kronofogden.se/du-har-fatt-ett-brev"
      - "https://www.kronofogden.se/nagon-har-krav-mot-dig"
      - "https://www.kronofogden.se/du-har-krav-mot-nagon"
      - "https://www.kronofogden.se/rad-och-stod"
      - "https://www.kronofogden.se/skuldsanering"
      - "https://www.kronofogden.se/sa-funkar-det-hos-kronofogden"
    max_pages: 50
  - id: polisen  # polisen, privatperson (svenska)
    urls:
      - "https://polisen.se/utsatt-for-brott/"
      - "https://polisen.se/lagar-och-regler/"
      - "https://polisen.se/tjanster-tillstand/"
    max_pages: 40
  - id: verksamt  # verksamt.se, starta och driva företag
    urls:
      - "https://verksamt.se/starta-foretag"
      - "https://verksamt.se/personal-rekrytering"
      - "https://verksamt.se/skatter-avgifter"
      - "https://verksamt.se/avveckla"
    max_pages: 40
  - id: pensionsmynd  # pensionsmyndigheten
    urls:
      - "https://www.pensionsmyndigheten.se/forsta-din-pension"
      - "https://www.pensionsmyndigheten.se/ga-i-pension"
      - "https://www.pensionsmyndigheten.se/for-pensionarer"
    max_pages: 40
  - id: vardguiden  # 1177, så fungerar vården (nationellt)
    urls:
      - "https://www.1177.se/sa-fungerar-varden/"
    max_pages: 40
  - id: transportstyrelsen  # transportstyrelsen, vägtrafik
    urls:
      - "https://www.transportstyrelsen.se/sv/vagtrafik/korkort/"
      - "https://www.transportstyrelsen.se/sv/vagtrafik/fordon/"
      - "https://www.transportstyrelsen.se/sv/vagtrafik/trafikregler-och-vagmarken/"
    max_pages: 40
  - id: unionens  # unionens a-kassa (redan klassad)
    urls:
      - "https://www.unionensakassa.se/"
    max_pages: 40
  - id: do  # diskrimineringsombudsmannen
    urls:
      - "https://www.do.se/diskriminerad"
      - "https://www.do.se/jobbet-skolan-samhallet"
    max_pages: 30
  - id: brottsoffer  # brottsoffermyndigheten
    urls:
      - "https://www.brottsoffermyndigheten.se/utsatt-for-brott/"
      - "https://www.brottsoffermyndigheten.se/sok-ersattning/"
    max_pages: 30

  # nästa i tur om budgeten räcker: pensionsmynd/af med högre tak, imy, arn, csn, aklagare, ivo, konsumenternas, av,
  # lantmateriet, fi, ei, pts, uhr, beo, skolverket, sis, jo, barnombudsmannen, krisinformation, afa, trr.
  # större lagar: sfb, föräldrabalken, ärvdabalken, äktenskapsbalken, utsökningsbalken, skollagen, utlänningslagen.
