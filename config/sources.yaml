# sources.yaml, 2026-10-31, budget: max 20 dollar för klassning
# urval: de officiella källor som täcker flest list-grenar per krona. sökvägar kontrollerade 2026-10-31.
# uppskattning: ~6 500 unika texter à ~0,23 cent (batch, max-depth 3) ≈ 15 dollar. osäkerhet ±30 %.
# lagar: bara korta, centrala lagar. stora balkar (sfb ~2 000 texter, inkomstskattelagen ~1 700) är utelämnade;
# deras innehåll täcks i klarspråk av fk, skatteverket och pensionsmyndigheten.

